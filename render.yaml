services:
  - type: web
    name: facturacion-sunat
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: facturacion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OSE_BASE_URL
        value: "https://api.nubefact.com/api/v1"
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: facturacion-db
    plan: free
    databaseName: facturacion
    user: facturacion_user
